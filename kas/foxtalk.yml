machine: luckfox-pico-mini-b
distro: foxtalk
target: foxtalk-image

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    refspec: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: scarthgap
    layers:
      meta-oe:
      meta-networking:
      meta-multimedia:
  meta-luckfox-bsp:
    path: meta-luckfox-bsp
    layers:
      .:

  meta-foxtalk:
    path: meta-foxtalk
    layers:
      .:
